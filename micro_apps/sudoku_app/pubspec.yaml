name: sudoku_app
description: "Offline Sudoku — the second app in the puzzle portfolio."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.4

dependencies:
  audioplayers: ^6.5.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  intl: any
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  timezone: ^0.10.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  image: ^4.5.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    # One bundle per difficulty rather than one file per puzzle: a Sudoku
    # is ~170 bytes of grid, so 100 of them fit in a single small JSON and
    # the list screen reads them with one asset load instead of 100.
    #
    # Unlike the crossword app there is no per-language split — a Sudoku
    # grid contains no words, so the same 400 puzzles serve every UI
    # language.
    - assets/puzzles/
    - assets/legal/
    - assets/audio/sfx/
    - assets/audio/music/

# Run `dart run flutter_launcher_icons` after changing anything under
# assets/icon/ to regenerate the platform icon files.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0F766E"
    theme_color: "#0F766E"

# Run `dart run flutter_native_splash:create` after changing anything
# here or under assets/icon/ to regenerate the native splash screens.
flutter_native_splash:
  color: "#0F766E"
  image: "assets/icon/icon_foreground.png"
  android_12:
    color: "#0F766E"
    image: "assets/icon/icon_foreground.png"
  web: false
