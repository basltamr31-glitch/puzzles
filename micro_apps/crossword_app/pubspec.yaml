name: crossword_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  audioplayers: ^6.5.1
  characters: ^1.4.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  intl: any
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  timezone: ^0.10.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/puzzles/en/easy/
    - assets/puzzles/en/medium/
    - assets/puzzles/en/hard/
    - assets/puzzles/en/expert/
    - assets/puzzles/ar/easy/
    - assets/puzzles/ar/medium/
    - assets/puzzles/ar/hard/
    - assets/puzzles/ar/expert/
    - assets/puzzles/de/easy/
    - assets/puzzles/de/medium/
    - assets/puzzles/de/hard/
    - assets/puzzles/de/expert/
    - assets/puzzles/fr/easy/
    - assets/puzzles/fr/medium/
    - assets/puzzles/fr/hard/
    - assets/puzzles/fr/expert/
    - assets/puzzles/es/easy/
    - assets/puzzles/es/medium/
    - assets/puzzles/es/hard/
    - assets/puzzles/es/expert/
    - assets/puzzles/it/easy/
    - assets/puzzles/it/medium/
    - assets/puzzles/it/hard/
    - assets/puzzles/it/expert/
    # Test-only fixture with fixed, hand-verified content. Never touched by
    # the puzzle generator and never scanned by PuzzleRepository's
    # per-language/difficulty listing, so it can't leak into the real
    # puzzle list — it exists purely so crossword_controller_test.dart has
    # stable content to assert against instead of depending on whatever
    # the generator currently wrote to a real puzzle slot.
    - assets/test_fixtures/
    - assets/legal/
    - assets/audio/sfx/
    - assets/audio/music/

# Run `dart run flutter_launcher_icons` after changing anything under
# assets/icon/ to regenerate the platform icon files.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#4F46E5"
    theme_color: "#4F46E5"

# Run `dart run flutter_native_splash:create` after changing anything
# here or under assets/icon/ to regenerate the native splash screens.
# Reuses icon_foreground.png (the transparent-background glyph) rather
# than the full icon, so the splash reads as "logo on brand color"
# instead of a gradient square nested inside a solid-color screen.
flutter_native_splash:
  color: "#4F46E5"
  image: "assets/icon/icon_foreground.png"
  android_12:
    color: "#4F46E5"
    image: "assets/icon/icon_foreground.png"
  web: false
